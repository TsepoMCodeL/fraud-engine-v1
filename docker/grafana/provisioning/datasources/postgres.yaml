apiVersion: 1

datasources:
  - name: Fraud Engine PostgreSQL
    uid: fraudengine-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER}
    database: ${POSTGRES_DB}
    isDefault: true
    editable: false
    jsonData:
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
    secureJsonData:
      password: $POSTGRES_PASSWORD
