server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

springdoc:
  show-actuator: true

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: fraud-detection-engine
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:fraudengine}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      connect-timeout: 2000ms
      client-type: lettuce
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

# Fraud Engine Custom Configuration
fraud:
  engine:
    redis-key-prefix: "fraud:"
    velocity-ttl-hours: 48
    review-threshold: 40
    decline-threshold: 75
    honor-hard-overrides: true
    short-circuit-enabled: true
    auto-record-transactions: true
    fail-open-on-fatal-error: false
    max-future-timestamp-skew: 5m
    admin:
      username: ${FRAUD_ADMIN_USERNAME:}
      password: ${FRAUD_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    fraudengine: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
